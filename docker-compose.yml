services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logsentry_backend
    ports:
      - "8000:8000"
    volumes:
      # Mount persistence data and brain models directories
      - ./data:/app/data
      - ./models:/app/models
    cap_add:
      - NET_ADMIN  # Grants required capabilities to run iptables inside the container namespace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - NEMOTRON_API_KEY=${NEMOTRON_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL}
      - NEMOTRON_MODEL=${NEMOTRON_MODEL}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL}
      - AGENT_TIMEOUT_SECONDS=${AGENT_TIMEOUT_SECONDS}
      - LOG_LEVEL=INFO

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: logsentry_frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: Nginx reverse proxy for production (single port 80/443)
