services:
  - type: web
    name: cerberus-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: NEMOTRON_API_KEY
        sync: false          # Set this manually in Render dashboard
      - key: DEEPSEEK_API_KEY
        sync: false          # Set this manually in Render dashboard
      - key: NVIDIA_BASE_URL
        value: "https://integrate.api.nvidia.com/v1"
      - key: ALLOWED_ORIGINS
        value: "https://cerberus-soc.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
