[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerberus"
version = "0.4.0"
description = "Multi-Agent DevSecOps & Security Intelligence Platform"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Aikagra", email = "aikagra@example.com"}
]
maintainers = [
    {name = "Aikagra", email = "aikagra@example.com"}
]
keywords = [
    "security", "soc", "hids", "ips", "ai", "ml", "devsecops", 
    "mitre", "threat-intelligence", "incident-response"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "openai>=1.40,<2",
    "python-dotenv>=1.0,<2",
    "structlog>=24.0,<25",
    "prometheus-client>=0.19,<1",
    "aiosqlite>=0.20,<1",
    "streamlit>=1.35,<2",
    "plotly>=5.20,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "pytest-mock>=3.14,<4",
    "ruff>=0.5,<1",
    "mypy>=1.11,<2",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
    "safety>=3.0,<4",
    "pre-commit>=3.7,<4",
]

[project.urls]
Homepage = "https://github.com/Aikagra-rgb/Cerberus"
Repository = "https://github.com/Aikagra-rgb/Cerberus"
Issues = "https://github.com/Aikagra-rgb/Cerberus/issues"
Documentation = "https://github.com/Aikagra-rgb/Cerberus/wiki"

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "api.py", "sentinel_engine.py", "trainer.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",      # line too long (handled by formatter)
    "T201",      # print statements (allowed in CLI scripts)
    "B008",      # function call in argument defaults (FastAPI pattern)
    "B007",      # unused loop variable
    "B904",      # raise from err (not critical)
    "B905",      # zip strict parameter
    "C408",      # dict() call (style preference)
    "E701",      # multiple statements on one line (legacy code)
    "E741",      # ambiguous variable name (ML convention)
    "N806",      # variable in function should be lowercase (ML convention)
    "W291",      # trailing whitespace
    "W293",      # blank line whitespace
    "W292",      # no newline at end of file
    "F541",      # f-string without placeholders
    "UP032",     # f-string vs format
    "UP035",     # typing.List vs list (legacy)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "T201"]
"sentinel_engine.py" = ["T201", "W291", "W293"]
"trainer.py" = ["T201", "N806", "E741", "B905"]
"attack_simulation_test.py" = ["T201", "S101", "B007"]
"dashboard.py" = ["W291", "W293", "C408", "T201"]
"src/ai_triage.py" = ["W293", "F541", "N806"]
"src/alert_store.py" = ["W293", "N806"]
"src/detection_service.py" = ["N806"]
"src/agents/llm_provider.py" = ["C408"]
"src/agents/orchestrator.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
namespace_packages = true

[tool.mypy-overrides]
module = [
    "pydantic",
    "fastapi",
    "uvicorn",
    "httpx",
    "pandas",
    "sklearn",
    "joblib",
    "openai",
    "structlog",
    "prometheus_client",
    "aiosqlite",
]
ignore_missing_imports = true

# numpy 2.x type stubs require Python 3.12+, ignore on 3.11
[tool.mypy-overrides.numpy]
ignore_errors = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101", "B601", "B310", "B608"]  # assert, shell=True, urllib, SQL (legacy/false positives)

[tool.vercel]
entrypoint = "api:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*Tests"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src", "api.py"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pre-commit]
default_stages = ["commit"]
fail_fast = false